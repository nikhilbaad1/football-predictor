[project]
name = "football-predictor"
version = "0.1.0"
description = "Football match outcome prediction — Elo and Dixon-Coles baseline with honest evaluation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.16,<0.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Selected explicitly rather than left to ruff's default, which has expanded
# across releases. CI treats lint as a gate, so the rule set has to be the
# project's choice and not drift when a new ruff ships.
#   E,F  pycodestyle + pyflakes    I  import order
#   B    bugbear                   UP pyupgrade
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
